<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="ti de">
  <title id="ti">FanOps - Network Analyst and Sysadmin</title>
  <desc id="de">Animated retro window: server racks with chasing LEDs, packets running along a link, a pixel cat peeking over the window edge, and the pixel title FANOPS.</desc>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .fb{transform-box:fill-box}
    .dim{fill:none;stroke:#2c2a58;stroke-width:5;stroke-dasharray:5 6}
    .ledA{fill:none;stroke:#5de2e7;stroke-width:5;stroke-dasharray:5 17;animation:chaseA 1.1s steps(2) infinite}
    .ledB{fill:none;stroke:#54d66a;stroke-width:5;stroke-dasharray:5 28;animation:chaseB 1.65s steps(3) infinite}
    .cab{fill:none;stroke-width:2.5;stroke-dasharray:7 7;animation:flow .9s linear infinite}
    .warn{animation:pd 1.3s steps(1) infinite}
    .sweep{animation:sweep 7s linear infinite}
    .gA{animation:gA 6s steps(1) infinite}
    .gB{animation:gB 6s steps(1) infinite}
    .boot{animation:boot 1.4s steps(1) 1 both}
    .cur{animation:cur 1s steps(1) infinite}
    .dot{animation:pd 1.6s ease-in-out infinite}
    .eyes{transform-origin:center;animation:blinkE 5.5s infinite}
    .earL{transform-origin:50% 100%;animation:twL 7s infinite}
    .earR{transform-origin:50% 100%;animation:twR 9s infinite}
    @keyframes chaseA{to{stroke-dashoffset:-22}}
    @keyframes chaseB{to{stroke-dashoffset:-33}}
    @keyframes flow{to{stroke-dashoffset:-14}}
    @keyframes pd{0%,100%{opacity:1}50%{opacity:.2}}
    @keyframes sweep{from{transform:translateY(-90px)}to{transform:translateY(430px)}}
    @keyframes gA{0%,90%,100%{transform:translate(0,0)}91%{transform:translate(-5px,1px)}93%{transform:translate(4px,-1px)}95%{transform:translate(-2px,0)}96%{transform:translate(0,0)}}
    @keyframes gB{0%,91%,100%{transform:translate(0,0)}92%{transform:translate(5px,-1px)}94%{transform:translate(-4px,1px)}96%{transform:translate(2px,0)}97%{transform:translate(0,0)}}
    @keyframes boot{0%{opacity:0}8%{opacity:1}14%{opacity:0}20%{opacity:1}26%{opacity:.3}32%,100%{opacity:1}}
    @keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes blinkE{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
    @keyframes twL{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-12deg)}92%{transform:rotate(0)}}
    @keyframes twR{0%,70%,100%{transform:rotate(0)}73%{transform:rotate(12deg)}76%{transform:rotate(0)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.sweep{display:none}}
  </style>

  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".28"/></pattern>
    <pattern id="groove" x="0" y="80" width="10" height="26" patternUnits="userSpaceOnUse"><rect width="10" height="26" fill="#10102a"/><rect y="24" width="10" height="2" fill="#26234d"/></pattern>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a8ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#b9a8ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b9a8ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="win"><rect x="21" y="21" width="958" height="338"/></clipPath>

    <!-- pixel title: 5x7 glyphs, 1 unit = 10px -->
    <g id="ttl">
      <path transform="scale(10)" d="M0 0h5v1H0z M0 1h1v6H0z M1 3h3v1H1z"/>
      <path transform="translate(60 0) scale(10)" d="M1 0h3v1H1z M0 1h1v6H0z M4 1h1v6h-1z M1 3h3v1H1z"/>
      <path transform="translate(120 0) scale(10)" d="M0 0h1v7H0z M4 0h1v7h-1z M1 1h1v2H1z M2 3h1v1H2z M3 4h1v2h-1z"/>
      <path transform="translate(180 0) scale(10)" d="M1 0h3v1H1z M1 6h3v1H1z M0 1h1v5H0z M4 1h1v5h-1z"/>
      <path transform="translate(240 0) scale(10)" d="M0 0h4v1H0z M0 1h1v6H0z M4 1h1v2h-1z M1 3h3v1H1z"/>
      <path transform="translate(300 0) scale(10)" d="M1 0h4v1H1z M0 1h1v2H0z M1 3h3v1H1z M4 4h1v2h-1z M0 6h4v1H0z"/>
    </g>

    <!-- cat pieces (1 unit = 8px) -->
    <path id="head" d="M1 2h14v1H1z M0 3h16v3H0z M1 6h14v1H1z M2 7h12v1H2z"/>
    <path id="eL" d="M2 0h2v1H2z M1 1h4v1H1z"/>
    <path id="eR" d="M12 0h2v1h-2z M11 1h4v1h-4z"/>
    <path id="paws" d="M2.5 8h3.5v1.5H2.5z M10 8h3.5v1.5H10z"/>
  </defs>

  <rect width="1000" height="380" fill="#0b0b1f"/>

  <!-- window frame -->
  <rect x="21" y="21" width="958" height="338" fill="#0f0f2b" stroke="#cdb4d8" stroke-width="2"/>
  <rect x="25" y="25" width="950" height="330" fill="none" stroke="#6f5f9a" stroke-width="1"/>

  <g clip-path="url(#win)">
    <!-- title bar -->
    <rect x="21" y="21" width="958" height="34" fill="#3a3466"/>
    <rect x="36" y="30" width="13" height="16" fill="none" stroke="#ffe7a3" stroke-width="2"/>
    <path d="M42.5 30v16" stroke="#ffe7a3" stroke-width="2"/>
    <text x="58" y="44" font-size="16" fill="#ffe7a3">README.md</text>
    <g transform="translate(886 27)">
      <rect width="24" height="20" fill="#8f80b8" stroke="#cdb4d8"/><path d="M7 14h10" stroke="#0f0f2b" stroke-width="2"/>
      <rect x="32" width="24" height="20" fill="#8f80b8" stroke="#cdb4d8"/><rect x="40" y="5" width="8" height="9" fill="none" stroke="#0f0f2b" stroke-width="2"/>
      <rect x="64" width="24" height="20" fill="#c26b8a" stroke="#cdb4d8"/><path d="M72 5l8 10M80 5l-8 10" stroke="#0f0f2b" stroke-width="2"/>
    </g>

    <!-- server racks -->
    <g>
      <rect x="44" y="80" width="88" height="260" fill="url(#groove)" stroke="#4a4280" stroke-width="2"/>
      <rect x="146" y="80" width="88" height="260" fill="url(#groove)" stroke="#4a4280" stroke-width="2"/>
      <rect x="248" y="80" width="88" height="260" fill="url(#groove)" stroke="#4a4280" stroke-width="2"/>

      <path class="dim" d="M56 93h64M56 119h64M56 145h64M56 171h64M56 197h64M56 223h64M56 249h64M56 275h64M56 301h64M56 327h64"/>
      <path class="ledA" d="M56 93h64M56 145h64M56 197h64M56 249h64M56 301h64"/>
      <path class="ledB" d="M56 119h64M56 171h64M56 223h64M56 275h64M56 327h64"/>

      <path class="dim" d="M158 93h64M158 119h64M158 145h64M158 171h64M158 197h64M158 223h64M158 249h64M158 275h64M158 301h64M158 327h64"/>
      <path class="ledA" style="animation-delay:-.4s;animation-duration:1.4s" d="M158 119h64M158 171h64M158 223h64M158 275h64M158 327h64"/>
      <path class="ledB" style="animation-delay:-.7s" d="M158 93h64M158 145h64M158 197h64M158 249h64M158 301h64"/>

      <path class="dim" d="M260 93h64M260 119h64M260 145h64M260 171h64M260 197h64M260 223h64M260 249h64M260 275h64M260 301h64M260 327h64"/>
      <path class="ledA" style="animation-delay:-.8s;animation-duration:.9s" d="M260 93h64M260 145h64M260 197h64M260 249h64M260 301h64"/>
      <path class="ledB" style="animation-delay:-1.1s;animation-duration:2.1s" d="M260 119h64M260 171h64M260 223h64M260 275h64M260 327h64"/>

      <rect class="warn" x="214" y="84" width="6" height="4" fill="#ff9a62"/>
      <rect class="warn" style="animation-delay:-.6s" x="316" y="84" width="6" height="4" fill="#ff5d73"/>
    </g>

    <!-- cables + uplink -->
    <path d="M336 110C372 110 344 262 380 262" fill="none" stroke="#26234d" stroke-width="5"/>
    <path d="M336 150C368 150 348 262 380 262" fill="none" stroke="#26234d" stroke-width="5"/>
    <path d="M336 190C364 190 352 262 380 262" fill="none" stroke="#26234d" stroke-width="5"/>
    <path class="cab" stroke="#5de2e7" d="M336 110C372 110 344 262 380 262"/>
    <path class="cab" stroke="#ff9a62" style="animation-duration:1.2s" d="M336 150C368 150 348 262 380 262"/>
    <path class="cab" stroke="#b78cff" style="animation-duration:.7s" d="M336 190C364 190 352 262 380 262"/>
    <path d="M380 262H958" stroke="#26234d" stroke-width="8"/>
    <path class="cab" stroke="#54d66a" d="M380 262H958"/>
    <circle class="dot" cx="958" cy="262" r="6" fill="#54d66a"/>
    <rect x="-6" y="-3" width="12" height="6" fill="#ffe7a3"><animateMotion dur="3.2s" repeatCount="indefinite" path="M380 262H958"/></rect>
    <rect x="-6" y="-3" width="12" height="6" fill="#5de2e7"><animateMotion dur="3.2s" begin="-1.1s" repeatCount="indefinite" path="M380 262H958"/></rect>
    <rect x="-6" y="-3" width="12" height="6" fill="#ff9a62"><animateMotion dur="3.2s" begin="-2.2s" repeatCount="indefinite" path="M380 262H958"/></rect>

    <!-- title -->
    <g class="boot">
      <g transform="translate(580 92)">
        <use xlink:href="#ttl" fill="#4a3a86" transform="translate(6 6)"/>
        <use xlink:href="#ttl" fill="#ff5da2" class="gB" opacity=".85"/>
        <use xlink:href="#ttl" fill="#5de2e7" class="gA" opacity=".85"/>
        <use xlink:href="#ttl" fill="#ffe7a3"/>
      </g>
      <text x="580" y="214" font-size="32" font-weight="700" fill="#ffe7a3" textLength="330" lengthAdjust="spacing">NETWORK ANALYST</text>
      <rect class="cur" x="918" y="190" width="14" height="26" fill="#54d66a"/>
      <text x="580" y="244" font-size="15" fill="#5de2e7" textLength="350" lengthAdjust="spacing">sysadmin / linux / packets / uptime</text>
    </g>

    <!-- status -->
    <circle class="dot" cx="586" cy="329" r="5" fill="#54d66a"/>
    <text x="600" y="334" font-size="14" fill="#8e89b8">STATUS: <tspan fill="#54d66a">ONLINE</tspan>  |  eth0 1000Mb/s  |  loss 0%</text>

    <!-- pixel cat peeking over the bottom edge -->
    <g transform="translate(384 282) scale(8)">
      <use xlink:href="#head" fill="#1a1536" stroke="#1a1536" stroke-width="1.5" stroke-linejoin="miter"/>
      <g class="earL fb">
        <use xlink:href="#eL" fill="#1a1536" stroke="#1a1536" stroke-width="1.5" stroke-linejoin="miter"/>
        <use xlink:href="#eL" fill="#fff3ea"/>
        <rect x="2" y="1" width="2" height="1" fill="#ff9bb0"/>
      </g>
      <g class="earR fb">
        <use xlink:href="#eR" fill="#1a1536" stroke="#1a1536" stroke-width="1.5" stroke-linejoin="miter"/>
        <use xlink:href="#eR" fill="#fff3ea"/>
        <rect x="12" y="1" width="2" height="1" fill="#ff9bb0"/>
      </g>
      <use xlink:href="#head" fill="#fff3ea"/>
      <rect x="5.6" y="2" width=".6" height=".9" fill="#e3cdd2"/>
      <rect x="7.4" y="2" width=".6" height="1.2" fill="#e3cdd2"/>
      <rect x="9.8" y="2" width=".6" height=".9" fill="#e3cdd2"/>
      <g class="eyes fb">
        <rect x="3" y="3.7" width="2" height="1.8" fill="#6fcf6f"/>
        <rect x="11" y="3.7" width="2" height="1.8" fill="#6fcf6f"/>
        <rect x="3.8" y="3.9" width=".5" height="1.4" fill="#1a1536"/>
        <rect x="11.7" y="3.9" width=".5" height="1.4" fill="#1a1536"/>
        <rect x="3.1" y="3.8" width=".5" height=".5" fill="#fff"/>
        <rect x="11.1" y="3.8" width=".5" height=".5" fill="#fff"/>
      </g>
      <rect x="7.4" y="5.3" width="1.2" height=".7" fill="#ff9bb0"/>
      <rect x="6.9" y="6.2" width=".6" height=".4" fill="#1a1536"/>
      <rect x="8.5" y="6.2" width=".6" height=".4" fill="#1a1536"/>
      <path d="M1 5l-3-.5M1 5.8l-3 .7M15 5l3-.5M15 5.8l3 .7" stroke="#cdb4d8" stroke-width=".25" fill="none"/>
      <use xlink:href="#paws" fill="#1a1536" stroke="#1a1536" stroke-width="1.5" stroke-linejoin="miter"/>
      <use xlink:href="#paws" fill="#fff3ea"/>
      <path d="M4 8.7v.8M5 8.7v.8M11.5 8.7v.8M12.5 8.7v.8" stroke="#e3cdd2" stroke-width=".25"/>
    </g>

    <!-- CRT overlay -->
    <rect x="21" y="21" width="958" height="338" fill="url(#scan)" pointer-events="none"/>
    <rect class="sweep" x="21" y="0" width="958" height="90" fill="url(#band)" pointer-events="none"/>
  </g>
</svg>
