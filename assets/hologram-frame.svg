<svg xmlns="http://www.w3.org/2000/svg" width="800" height="100" viewBox="0 0 800 100">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="scanline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF007F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background / Scanline -->
  <rect x="0" y="0" width="800" height="100" fill="transparent" />
  <rect x="0" y="0" width="800" height="20" fill="url(#scanline)">
    <animate attributeName="y" values="-20;120;-20" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- Outer Border -->
  <rect x="4" y="4" width="792" height="92" rx="4" ry="4" stroke="#FF007F" stroke-width="2" fill="none" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite" />
  </rect>
  <rect x="10" y="10" width="780" height="80" rx="2" ry="2" stroke="#00FFFF" stroke-width="1" fill="none" opacity="0.4" stroke-dasharray="4 4" />

  <!-- Korean Text & Cyberpunk Accents -->
  <g filter="url(#glow)">
    <!-- Main Korean Text -->
    <text x="400" y="55" font-family="sans-serif" font-size="28" font-weight="bold" fill="#00FFFF" text-anchor="middle" letter-spacing="4">
      시스템 오류: 환영합니다
    </text>
    <!-- Subtitle -->
    <text x="400" y="80" font-family="monospace" font-size="12" fill="#FF007F" text-anchor="middle" letter-spacing="2">
      S Y S T E M   O N L I N E // K - C Y B E R P U N K   M O D E
    </text>

    <!-- Decorative HUD Elements -->
    <!-- Left Side -->
    <path d="M 40,50 L 120,50" stroke="#00FFFF" stroke-width="4" />
    <path d="M 50,60 L 100,60" stroke="#FF007F" stroke-width="2" />
    <circle cx="45" cy="50" r="3" fill="#FFF" />
    
    <text x="40" y="30" font-family="monospace" font-size="10" fill="#00FFFF" letter-spacing="1">경고 (WARN)</text>
    
    <!-- Right Side -->
    <path d="M 760,50 L 680,50" stroke="#00FFFF" stroke-width="4" />
    <path d="M 750,60 L 700,60" stroke="#FF007F" stroke-width="2" />
    <circle cx="755" cy="50" r="3" fill="#FFF" />
    
    <text x="760" y="30" font-family="monospace" font-size="10" fill="#00FFFF" text-anchor="end" letter-spacing="1">로딩 중...</text>
  </g>
</svg>
