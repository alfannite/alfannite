<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%">
  <!-- Definition of filters and gradients -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="scanline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00ffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="rounded">
      <rect x="0" y="0" width="100%" height="100%" rx="8" ry="8" />
    </clipPath>
  </defs>

  <!-- The original image -->
  <!-- Clip path to keep the 8px border radius mentioned in README -->
  <image xlink:href="../img/bannergif.gif" width="100%" height="100%" preserveAspectRatio="none" clip-path="url(#rounded)" />

  <!-- Animated scan-line sweeping vertically -->
  <rect x="0" y="0" width="100%" height="20%" fill="url(#scanline)" clip-path="url(#rounded)" style="pointer-events:none;">
    <animate attributeName="y" values="-20%;120%;-20%" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Subtle outer border with pulsing opacity -->
  <rect x="1%" y="1%" width="98%" height="98%" rx="8" ry="8" stroke="#8b5cf6" stroke-width="2" fill="none" style="pointer-events:none;">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite" />
  </rect>

  <!-- Top-left brackets -->
  <svg x="0" y="0" overflow="visible">
    <g stroke="#00ffff" stroke-width="3" fill="none" filter="url(#glow)">
      <path d="M 15,35 L 15,15 L 35,15" />
      <path d="M 20,20 L 45,20" stroke-width="1" opacity="0.6" />
    </g>
  </svg>

  <!-- Top-right brackets -->
  <svg x="100%" y="0" overflow="visible">
    <g stroke="#00ffff" stroke-width="3" fill="none" filter="url(#glow)">
      <path d="M -15,35 L -15,15 L -35,15" />
      <path d="M -20,20 L -45,20" stroke-width="1" opacity="0.6" />
    </g>
  </svg>

  <!-- Bottom-left brackets -->
  <svg x="0" y="100%" overflow="visible">
    <g stroke="#00ffff" stroke-width="3" fill="none" filter="url(#glow)">
      <path d="M 15,-35 L 15,-15 L 35,-15" />
      <path d="M 20,-20 L 45,-20" stroke-width="1" opacity="0.6" />
    </g>
  </svg>

  <!-- Bottom-right brackets -->
  <svg x="100%" y="100%" overflow="visible">
    <g stroke="#00ffff" stroke-width="3" fill="none" filter="url(#glow)">
      <path d="M -15,-35 L -15,-15 L -35,-15" />
      <path d="M -20,-20 L -45,-20" stroke-width="1" opacity="0.6" />
    </g>
  </svg>

  <!-- Optional data ticks top/bottom center -->
  <svg x="50%" y="0" overflow="visible">
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#00ffff" stroke-width="4" opacity="0.8" />
  </svg>
  <svg x="50%" y="100%" overflow="visible">
    <line x1="-20" y1="-2" x2="20" y2="-2" stroke="#00ffff" stroke-width="4" opacity="0.8" />
  </svg>
</svg>
